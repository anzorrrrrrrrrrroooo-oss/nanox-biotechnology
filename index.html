<script>
async function verifyCode() {

}

result.textContent = "Checking...";

try {
const response = await fetch(
"https://qvnvujxyljovsioicuhv.supabase.co/functions/v1/swift-responder",
{
method: "POST",
headers: {
"Content-Type": "application/json",
"apikey": "sb_publishable_rRa83-u09GY_9CkxkviX2A_sawH3mIQ
"Authorization": "Bearer sb_publishable_rRa83-u09GY_9CkxkviX2A_sawH3mIQ
},
body: JSON.stringify({code: code})
}
);

const data = await response.json();

result.textContent = data.valid
? "Original NANOX product"
: "Code not found";

} catch (error) {
result.textContent = "Connection error";
}
}
</script>
